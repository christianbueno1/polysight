[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polysight"
version = "0.1.1"
description = "Clasificación reproducible de hallazgos HyperKvasir con EfficientNet-B0"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "matplotlib>=3.8,<4",
  "mlflow>=2.10,<3",
  "numpy>=1.26,<2",
  "pandas>=2.1,<3",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
  "scikit-learn>=1.4,<2",
  "seaborn>=0.13,<1",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.5,<1",
]

[project.scripts]
polysight-prepare = "polysight.data.prepare:main"
polysight-split = "polysight.data.split:main"
polysight-train = "polysight.train:main"
polysight-evaluate = "polysight.evaluate:main"
polysight-predict = "polysight.predict:main"
polysight-render-matrix = "polysight.render_matrix:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/test_model_and_metrics.py" = ["E402"]
